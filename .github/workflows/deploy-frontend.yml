name: Deploy newspaper frontend
on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: 'Deploy the tested frontend to the existing Static Web App'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency: {group: production-frontend-deployment, cancel-in-progress: false}
jobs:
  deploy:
    if: inputs.confirm_deployment && github.ref == 'refs/heads/main'
    environment: azure-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        shell: bash
        env:
          FUNCTION_API_URL: ${{ vars.FUNCTION_API_URL }}
          DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [[ ! "$FUNCTION_API_URL" =~ ^https://[A-Za-z0-9.-]+\.azurewebsites\.net/api/?$ ]]; then
            echo '::error::Set FUNCTION_API_URL to the existing Function App HTTPS URL including /api.'
            exit 1
          fi
          if [[ -z "$DEPLOYMENT_TOKEN" ]]; then
            echo '::error::Set AZURE_STATIC_WEB_APPS_API_TOKEN to the existing Static Web App deployment token.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.FUNCTION_API_URL }}
      - name: Check the existing public backend
        env:
          FUNCTION_API_URL: ${{ vars.FUNCTION_API_URL }}
        run: curl --fail --silent --show-error --max-time 30 --retry 2 "${FUNCTION_API_URL%/}/articles" --output /dev/null
      - name: Upload static frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          skip_api_build: true
